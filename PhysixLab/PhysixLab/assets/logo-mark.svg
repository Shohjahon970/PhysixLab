<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <radialGradient id="nucleusGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#e8ecf7"/>
      <stop offset="35%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="17" fill="url(#haloGrad)"/>

  <ellipse cx="32" cy="32" rx="24" ry="10" fill="none" stroke="url(#orbitGrad)" stroke-width="2" opacity="0.95"/>
  <ellipse cx="32" cy="32" rx="24" ry="10" fill="none" stroke="url(#orbitGrad)" stroke-width="2" opacity="0.7" transform="rotate(60 32 32)"/>
  <ellipse cx="32" cy="32" rx="24" ry="10" fill="none" stroke="url(#orbitGrad)" stroke-width="2" opacity="0.5" transform="rotate(120 32 32)"/>

  <circle cx="52.8" cy="27" r="2.4" fill="#00e5ff" filter="url(#softGlow)"/>

  <circle cx="32" cy="32" r="5.6" fill="url(#nucleusGrad)" filter="url(#softGlow)"/>
</svg>
