<svg width="360" height="96" viewBox="0 0 360 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <radialGradient id="nucleusGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#e8ecf7"/>
      <stop offset="35%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="65%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(48 48)">
    <circle r="26" fill="#00e5ff" opacity="0.12"/>
    <ellipse rx="36" ry="15" fill="none" stroke="url(#orbitGrad)" stroke-width="3" opacity="0.95"/>
    <ellipse rx="36" ry="15" fill="none" stroke="url(#orbitGrad)" stroke-width="3" opacity="0.7" transform="rotate(60)"/>
    <ellipse rx="36" ry="15" fill="none" stroke="url(#orbitGrad)" stroke-width="3" opacity="0.5" transform="rotate(120)"/>
    <circle cx="31.2" cy="-7.5" r="3.6" fill="#00e5ff" filter="url(#softGlow)"/>
    <circle r="8.4" fill="url(#nucleusGrad)" filter="url(#softGlow)"/>
  </g>

  <text x="106" y="60" font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" fill="url(#textGrad)">PhysixLab</text>
</svg>
